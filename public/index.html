<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Título e descrição -->
<title>cartbuy</title>
<meta name="author" content="Younk">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://cartbuy.vercel.app/">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="cartbuy">
<meta property="og:url" content="https://cartbuy.vercel.app/">
<meta property="og:image" content="https://cartbuy.vercel.app/og-image.webp">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/webp">
<meta property="og:locale" content="pt_BR">


<!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#121212">

<!-- Performance: conecta cedo com os domínios do Firebase usados pelo app -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://www.gstatic.com">

<link rel="stylesheet" href="style.css">

<!-- JSON-LD Schema.org -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "cartbuy",
  "description": "Aplicativo para organizar listas de compras e desejos, com busca automática de dados do produto, categorias personalizáveis, sincronização na nuvem e backup local.",
  "url": "https://cartbuy.vercel.app/",
  "inLanguage": "pt-BR",
  "applicationCategory": "LifestyleApplication",
  "operatingSystem": "Web",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "BRL"
  }
}
</script>
</head>
<body>
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h1>Login</h1>

    <form id="emailAuthForm">
      <input type="text" id="authUsername" placeholder="Nome de usuário" autocomplete="username" hidden>
      <input type="text" id="authEmail" placeholder="E-mail ou usuário" autocomplete="username" required>
      <input type="password" id="authPassword" placeholder="Senha" autocomplete="current-password" required>
      <button type="submit" class="btn-primary" id="emailAuthBtn">Entrar</button>
    </form>
    <div class="auth-toggle">
      <button class="link-btn" id="authModeToggle">Não tem conta? Criar conta</button>
      <button class="link-btn" id="forgotPasswordBtn">Esqueci minha senha</button>
    </div>

    <div class="auth-divider"><span>ou</span></div>

    <button class="btn-primary" id="googleLoginBtn">Entrar com Google</button>
    <p class="fetch-status error" id="authError"></p>
  </div>
</div>

<div class="app" id="appRoot" hidden>
  <div class="user-bar">
    <span id="userLabel"></span>
    <button class="link-btn" id="logoutBtn">Sair</button>
  </div>

  <header>
    <h1>cartbuy</h1>
    <span class="pending" id="pendingCount"></span>
  </header>
  <div class="summary" id="summary"></div>

  <div class="top-bar">
    <div id="formArea"></div>
    <div class="data-actions">
      <button class="btn-secondary" id="exportBtn">Exportar backup</button>
      <button class="btn-secondary" id="importBtn">Importar backup</button>
      <input type="file" id="importInput" accept="application/json" hidden>
    </div>
  </div>

  <div class="toolbar" id="toolbar"></div>

  <div class="filters" id="filters"></div>
  <div class="items" id="items"></div>
</div>

<div id="toastArea"></div>

<script type="module" src="app.js"></script>
</body>
</html>
